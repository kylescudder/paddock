name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: paddock_test
          POSTGRES_USER: paddock_test_owner
          # Disposable job-local database, isolated from production.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paddock_test_owner -d paddock_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Typecheck and build with the frozen lockfile, and prepare official fonts
        run: docker build --target build -t paddock:checks .
      - name: Lint
        run: docker run --rm paddock:checks bun run lint
      - name: Check formatting, rendering, calendar changes, model discovery, admin sign-in restrictions and Emby updates
        run: |
          docker run --rm --network host \
            -e TEST_DATABASE_URL=postgres://paddock_test_owner@127.0.0.1:5432/paddock_test \
            paddock:checks sh -c 'bun run format:check && bun run db:check && bun run test && bun run test:connections'
      - name: Verify deployment provenance, acceptance, backup and rollback gates
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Verify webhook authentication, acknowledgement and queue limits
        run: |
          docker run --rm -v "$PWD/deploy/receiver:/app:ro" -w /app \
            node:24-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f \
            node --test server.test.mjs
      - name: Build the production runtime without publishing
        run: docker build --build-arg PADDOCK_REVISION="$GITHUB_SHA" -t paddock:ci .

  e2e:
    name: E2E tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        run: HUSKY=0 bun install --frozen-lockfile
      - name: Install disposable PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          pg_config --bindir >> "$GITHUB_PATH"
      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: |
          set -o pipefail
          mkdir -p artifacts/e2e-ci
          bun run test:e2e 2>&1 | tee artifacts/e2e-ci/run.log
      - name: Save test reports and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: true
          name: e2e-evidence
          retention-days: 7
          path: |
            .local/emby-selection/report/
            .local/emby-selection/test-results/
            artifacts/e2e-ci/
