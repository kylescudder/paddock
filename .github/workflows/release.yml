# Publishes a checked, attested image for every commit on main. GitHub holds
# only webhook/Access credentials, never database credentials or shell access.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paddock-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kylescudder/paddock

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: PADDOCK_REVISION=${{ github.sha }}
          provenance: false
          sbom: false
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/${PLATFORM//\//-}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/release/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: manifest
        name: Create multi-platform manifest
        run: |
          sources=()
          for file in digests/*; do sources+=("$IMAGE@$(cat "$file")"); done
          docker buildx imagetools create -t "$IMAGE:sha-$GITHUB_SHA" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      # GitHub's attestations API excludes user-owned private repositories.
      # The official toolkit supports skipWrite; store and verify its bundle in GHCR.
      - name: Sign and publish registry-only provenance
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci --ignore-scripts --prefix deploy/release
          node deploy/release/attest.mjs
          gh attestation verify "oci://$IMAGE@$DIGEST" --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      # Move the main tag only after the attestation exists.
      - name: Tag main
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: docker buildx imagetools create -t "$IMAGE:main" "$IMAGE@$DIGEST"

  # Asks the host to deploy the attested digest, then waits for the host to acknowledge
  # that it passed acceptance checks and for the public site to report this commit.
  # The host verifies the attestation itself, so the webhook secret can only ever trigger a release that this workflow built from main.
  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    environment:
      name: production
      url: ${{ vars.PADDOCK_BASE_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_URL: https://deploy-paddock.thescudders.org/hooks/paddock
      HEALTH_URL: ${{ vars.PADDOCK_BASE_URL }}/api/health
    steps:
      - name: Check deploy endpoint protection
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          [[ -n "$CF_ACCESS_CLIENT_ID" && -n "$CF_ACCESS_CLIENT_SECRET" ]] || { echo '::error::Configure the production Cloudflare Access service-token secrets.'; exit 1; }
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --dump-header "$headers" -X POST "$DEPLOY_URL")
          [[ "$status" = 401 || "$status" = 403 ]] || { echo "::error::Cloudflare Access did not block an unauthenticated request ($status)."; exit 1; }
          ! grep -qi '^x-paddock-deploy-hook: 1' "$headers" || { echo '::error::Unauthenticated request reached the receiver.'; exit 1; }
          for path in / /healthz /other; do
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "https://deploy-paddock.thescudders.org$path")
            [[ "$status" = 404 ]] || { echo "::error::Non-webhook path returned $status."; exit 1; }
          done
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --dump-header "$headers" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'X-Paddock-Signature: sha256=invalid' --data '{}' "$DEPLOY_URL")
          [[ "$status" = 401 ]] || { echo "::error::Invalid webhook signature returned $status."; exit 1; }
          grep -qi '^x-paddock-deploy-hook: 1' "$headers" || { echo '::error::Service token did not reach the receiver.'; exit 1; }
      - name: Request deploy
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          body=$(jq -cn --arg digest "$DIGEST" --arg revision "$GITHUB_SHA" --argjson timestamp "$(date +%s)" \
            '{digest: $digest, revision: $revision, timestamp: $timestamp}')
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $NF}')
          curl --fail-with-body --silent --show-error --max-time 30 "$DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "X-Paddock-Signature: sha256=$signature" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --data "$body"
      - name: Wait for production to complete acceptance of this commit
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          for attempt in $(seq 60); do
            accepted=$(curl --fail --silent --max-time 10 "$DEPLOY_URL" \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              | jq -r --arg revision "$GITHUB_SHA" --arg image "$IMAGE@$DIGEST" \
                'if .revision == $revision and .image == $image then .status else "pending" end' || true)
            revision=$(curl --fail --silent --max-time 10 --dump-header - --output /dev/null "$HEALTH_URL" \
              | tr -d '\r' | awk -F': ' 'tolower($1) == "x-paddock-revision" {print $2}' || true)
            if [ "$accepted" = deployed ] && [ "$revision" = "$GITHUB_SHA" ]; then
              echo "The host accepted $IMAGE@$DIGEST after full checks; production is running $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production did not complete acceptance for $GITHUB_SHA within 10 minutes (last: ${revision:-none}, acceptance: ${accepted:-none}). Check state/deploy.log on the host."
          exit 1
