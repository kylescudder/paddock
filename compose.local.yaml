name: paddock-local
services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paddock
      POSTGRES_USER: paddock
      # Disposable local database, reachable only from this Compose project.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: ["paddock-db:/var/lib/postgresql"]
    healthcheck:
      test: [CMD, pg_isready, -U, paddock, -d, paddock]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    image: paddock:local
    init: true
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    environment:
      APP_URL: http://localhost:3000
      DATA_DIR: /app/data
      DATABASE_URL: postgres://paddock@db:5432/paddock
      PADDOCK_MIGRATE: "1"
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AUTH_EMAIL_DAILY_LIMIT: ${AUTH_EMAIL_DAILY_LIMIT:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBY_URL: ${EMBY_URL:-}
      EMBY_API_KEY: ${EMBY_API_KEY:-}
    volumes: ["paddock-data:/app/data"]
volumes:
  paddock-data:
  paddock-db:
